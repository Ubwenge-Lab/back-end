name: Unit & Build Fast Gate

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  unit-and-build:
    name: Fast Unit, Build & Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint (without --fix)
        run: npx eslint .

      - name: NestJS Build Gate
        run: npx nest build

      - name: Validate Prisma Schema
        run: npx prisma validate

      - name: Run Unit Tests with Coverage
        run: npm test -- --ci --coverage --forceExit

      - name: Dependency Security Audit (High/Critical)
        run: npm audit --audit-level=high
